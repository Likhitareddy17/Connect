<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}CONNECT is a calm space for spiritual, mental, and emotional well-being.{% endblock %}">
  <meta name="theme-color" content="#f7f2ea">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}CONNECT{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  {% if request.endpoint == "home" %}<link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">{% endif %}
</head>
<body class="{% if request.endpoint == 'home' %}home-page{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}" aria-label="CONNECT home">
        <span class="brand-mark" aria-hidden="true">♧</span>
        <span class="brand-copy">
          <strong>CONNECT</strong>
          <small>spiritual · mental · emotional</small>
        </span>
      </a>
      {% if current_user.is_authenticated %}
      <nav class="topbar-nav" aria-label="Primary navigation">
        <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}"><span aria-hidden="true">⌂</span> Home</a>
        <a href="{{ url_for('spiritual') }}" class="{% if request.endpoint == 'spiritual' %}active{% endif %}"><span aria-hidden="true">✧</span> Soul</a>
        <a href="{{ url_for('mental') }}" class="{% if request.endpoint == 'mental' %}active{% endif %}"><span aria-hidden="true">♧</span> Mind</a>
        <a href="{{ url_for('emotional') }}" class="{% if request.endpoint == 'emotional' %}active{% endif %}"><span aria-hidden="true">♡</span> Heart</a>
      </nav>
      <form method="post" action="{{ url_for('logout') }}" class="logout-form header-logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="signout-button"><span aria-hidden="true">⇥</span> Sign Out</button>
      </form>
      {% endif %}
    </header>    <main id="main">
      {% block content %}{% endblock %}
    </main>
  </div>



  <script>
    window.csrfHeaders = function (extra) {
      const token = document.querySelector('meta[name="csrf-token"]').content;
      return Object.assign({ "X-CSRFToken": token }, extra || {});
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
